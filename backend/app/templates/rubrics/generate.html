{% extends "base.html" %}

{% block title %}Generate Rubric{% endblock %}
{% block header_title %}AI-Powered Dynamic Rubric Generation{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px;">
    <p>Enter the topic, syllabus snippet, or learning objectives below. The AI will generate a structured grading rubric.</p>
    <form method="POST">
        <div class="form-group">
            <label>Prompt / Course Material</label>
            <textarea name="prompt" class="form-control" rows="6" placeholder="e.g., Generate a rubric for an essay about the causes of the French Revolution..." required></textarea>
        </div>
        <button type="submit" class="btn">Generate Rubric with AI</button>
    </form>
</div>
{% endblock %}
