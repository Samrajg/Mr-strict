{% extends "base.html" %}

{% block title %}Sign In - Mr Strict{% endblock %}
{% block header_title %}Instructor Authentication{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 40px auto; padding: 30px;">
    <h3 style="margin-top: 0; margin-bottom: 20px; color: var(--secondary); text-align: center;">Sign In</h3>
    <form method="POST">
        <div class="form-group">
            <label for="username"><strong>Username</strong></label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password"><strong>Password</strong></label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 1.05em;">Sign In</button>
    </form>
</div>
{% endblock %}
